services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: relaydesk
      POSTGRES_PASSWORD: relaydesk
      POSTGRES_DB: relaydesk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relaydesk -d relaydesk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
